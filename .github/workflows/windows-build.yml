name: Windows x64 DLL

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Configure MSVC x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel 4
      - name: Run native, C ABI and Python ctypes tests
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Verify exact DLL exports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dumpbin) { throw "dumpbin not found" }
          $output = & $dumpbin.FullName /exports build/Release/FPAnalyzer.dll
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed" }
          $output | Write-Output
          $names = @($output | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') { $Matches[1] }
          }) | Sort-Object
          if (($names -join ',') -cne 'FP_AnalyzeFrameU8,FP_GetApiVersion') {
            throw "Unexpected DLL exports: $($names -join ',')"
          }
      - name: Stage distributable
        run: cmake --install build --config Release --prefix package
      - name: Upload DLL and public header
        uses: actions/upload-artifact@v4
        with:
          name: FPAnalyzer-windows-x64
          path: |
            package/bin/FPAnalyzer.dll
            package/include/FPAnalyzer.h
          if-no-files-found: error
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FPAnalyzer-test-report
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
